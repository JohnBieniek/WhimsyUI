<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whimsy Work review</title><style>/* STYLE */</style></head>
<body><header><div><h1>Work review</h1><p id="build"></p></div><div class="actions"><button id="export">Export notes</button><label class="button">Import notes<input id="import" type="file" accept="application/json" hidden></label><span id="progress"></span></div></header>
<div class="app"><aside><label>Find a page<input id="search" type="search" placeholder="Search project names"></label><div id="pages"></div></aside>
<main><section class="toolbar"><div class="actions"><h2 id="page-title"></h2><button id="previous-page" aria-label="Previous page">Previous page</button><button id="next-page" aria-label="Next page">Next page</button></div>
<div class="actions"><label>Sizes<select id="group"><option value="all">All sizes</option><option value="phone">Phones</option><option value="tablet">Tablets</option><option value="desktop">Desktop</option><option value="zoom">Browser zoom</option></select></label><label>Review status<select id="filter"><option value="">All</option><option value="pending">Unreviewed</option><option value="flagged">Flagged</option><option value="approved">Approved</option></select></label><label>Image size<select id="scale"><option value="fit">Fit width</option><option value="actual">Actual pixels</option></select></label><label class="check"><input id="keep-scroll" type="checkbox" checked> Keep position between sizes</label></div>
<div id="sizes" aria-label="Screen sizes"></div>
<div class="actions"><button id="previous">Previous size</button><button id="next">Next size</button><span id="count"></span><button id="approve">Approve &amp; next</button><button id="flag">Flag &amp; add note</button><label>Decision<select id="decision"><option value="pending">Unreviewed</option><option value="flagged">Flagged</option><option value="approved">Approved</option></select></label></div>
<details id="notes"><summary>Notes and capture reference</summary><label>Note<textarea id="note" rows="2" placeholder="What needs changing?"></textarea></label><p id="reference"></p><div class="actions"><button id="copy">Copy reference + note</button><a id="full" target="_blank" rel="noopener">Open image</a></div></details><p id="warnings"></p><p id="notice" role="status" aria-live="polite"></p></section>
<section id="viewer" aria-label="Page screenshot"><img id="current" alt="Selected page screenshot"></section><p class="help">Alt + Left / Right: sizes. Alt + Up / Down: pages. Decisions and notes save in this browser; export to keep a backup.</p></main></div>
<script>/* DATA */</script><script>/* SCRIPT */</script></body></html>
